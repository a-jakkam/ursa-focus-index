[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ursa-focus-index"
version = "0.1.0"
description = "Experimental EEG spectral index monitoring for the URSA research project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
lsl = ["pylsl>=1.17,<2"]

[project.scripts]
ursa-focus = "ursa_focus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

